<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distribuição de Medicamentos</title>

    <link rel="stylesheet" href="./distribuicoes.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        if (localStorage.getItem('usuarioLogado') !== 'true') {
            window.location.href = '../auth/login.html';
        }
    </script>
</head>

<body>

    <!-- HEADER -->
    <div class="page-header">
        <a href="../menu/menu.html" class="logo-link">
            <img src="../assets/logo.png" alt="Logo" class="logo">
        </a>
        <h1 id="table">Distribuição de Medicamentos</h1>
        <div class="user-chip">
            <div class="user-chip-avatar" id="user-initials"></div>
            <span id="user-nome">Usuário</span>
            <button id="btn-sair"><i data-lucide="log-out"></i> Sair</button>
        </div>
    </div>

    <!-- TOOLBAR -->
    <div class="toolbar-container">
        <input id="campo-pesquisa" placeholder="🔎 Buscar distribuição por cliente ou medicamento...">
        <div class="button-group">
            <button id="btnPaginacaoMenos"><i data-lucide="chevron-left"></i></button>
            <button id="btnPaginacao"><i data-lucide="chevron-right"></i></button>
            <button id="btn-nova-distribuicao"><i data-lucide="plus-circle"></i> Nova</button>
        </div>
    </div>

    <!-- TABELA -->
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Cliente</th>
                <th>Medicamentos</th>
                <th>Data</th>
                <th>Usuário</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
    </table>

    <!-- PAINEL COMPLETO -->
    <div id="painel-overlay" class="painel-overlay">
        <div class="painel-lateral">

            <div class="painel-header">
                <h3>Nova Distribuição</h3>
                <button id="btn-fechar-painel">X</button>
            </div>

            <input id="busca-cliente" placeholder="Cliente">
            <div id="lista-clientes"></div>

            <input id="busca-medicamento" placeholder="Medicamento">
            <div id="lista-medicamentos"></div>

            <input id="input-quantidade" type="number" value="1">

            <button id="btn-adicionar-item">Adicionar</button>

            <div id="carrinho-lista"></div>

            <button id="btn-confirmar">Confirmar</button>

        </div>
    </div>

    <!-- MODAL -->
    <div id="modal-aviso-container" class="modal-overlay">
        <div id="caixa-aviso" class="modal-content">
            <h3 id="aviso-titulo"></h3>
            <p id="aviso-texto"></p>
            <button id="btn-aviso-ok">OK</button>
            <button id="btn-aviso-cancelar">Cancelar</button>
        </div>
    </div>

    <script src="./distribuicoes.js" type="module" defer></script>
    <script>lucide.createIcons();</script>

</body>
</html>
