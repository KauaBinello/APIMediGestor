<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediGestor - Menu Principal</title>
    <link rel="stylesheet" href="menu.css">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        /* Proteção visual inicial */
        body {
            display: none;
        }
    </style>

    <script>
        if (localStorage.getItem('usuarioLogado') !== 'true') {
            window.location.href = '../auth/login.html';
        } else {
            document.documentElement.style.display = 'block';
            document.addEventListener("DOMContentLoaded", () => {
                document.body.style.display = 'flex';
            });
        }
    </script>
</head>

<body>

    <div id="menu-container">
        <div class="user-card">
            <p>Usuário: <span id="nome-usuario-display">---</span></p>
            <p>Perfil: <strong id="perfil-exibicao">---</strong></p>
            <button id="btn-logout" title="Sair do Sistema">
                <i data-lucide="log-out"></i> Sair
            </button>
        </div>

        <div class="menu-card">
            <div class="logo-section">
            <img src="../assets/logo.png" alt="logo">
            </div>
            <nav class="menu-nav">
                <button onclick="location.href='../medicamentos/medicamentos.html'">
                    Cadastro de medicamentos
                </button>
                <button onclick="location.href='../clientes/clientes.html'">
                    Cadastro de clientes
                </button>
                <button id="btn-usuarios" style="display: none;" onclick="location.href='../usuarios/usuarios.html'">
                    Cadastro de Usuários
                </button>
                <button onclick="location.href='../distribuicoes/distribuicoes.html'">
                    Distribuição de medicamentos
                </button>
            </nav>
        </div>
    </div>

    <script src="menu.js"></script>
    <script>lucide.createIcons();</script>
</body>

</html>
