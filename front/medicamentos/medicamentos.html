<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Medicamentos</title>
    <link rel="stylesheet" href="medicamentos.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="medicamentos.js" type="module" defer></script>

    <style>
        /* Esconde o corpo da página imediatamente ao carregar */
        body {
            display: none;
        }
    </style>

    <script>
        // Checagem ultra rápida antes de renderizar o resto
        if (localStorage.getItem('usuarioLogado') !== 'true') {
            window.location.href = '../auth/login.html';
        } else {
            // Se estiver logado, mostra a página
            document.documentElement.style.display = 'block';
            document.addEventListener("DOMContentLoaded", () => {
                document.body.style.display = 'block';
            });
        }
    </script>

</head>

<body>

    <h1 id="table">Gerenciamento de Medicamentos</h1>

    <div class="toolbar-container">
        <button id="btn-sair" style="background: #d9534f; margin-left: auto;">
            <i data-lucide="log-out"></i> Sair
        </button>
        <input id="campo-pesquisa" placeholder="🔎 Buscar medicamento pelo nome...">

        <div class="button-group">
            <button id="btnPaginacaoMenos" title="Anterior">
                <i data-lucide="chevron-left"></i>
            </button>
            <button id="btnPaginacao" title="Próximo">
                <i data-lucide="chevron-right"></i>
            </button>
            <button id="cadastrar-novo">
                <i data-lucide="plus-circle"></i> Novo Medicamento
            </button>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Nome / Embalagem</th>
                <th>Saldo</th>
                <th>Validade</th>
                <th style="text-align: center;">Ações</th>
            </tr>
        </thead>
        <tbody id="corpo-tabela"></tbody>
    </table>

    <div id="modal-container">
        <div id="caixa-modal">
            <h2 id="tituloModal">Medicamento</h2>

            <label for="editNome">Nome do Medicamento</label>
            <input id="editNome" placeholder="Ex: Paracetamol">

            <div style="display: flex; gap: 10px;">
                <div style="flex: 2;">
                    <label for="editConcentracao">Dosagem</label>
                    <input id="editConcentracao" placeholder="Ex: 500">
                </div>
                <div style="flex: 1;">
                    <label for="editUnidadeMedida">Unidade</label>
                    <select id="editUnidadeMedida">
                        <option value="mg">mg</option>
                        <option value="g">g</option>
                        <option value="ml">ml</option>
                        <option value="mcg">mcg</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 10px;">
                <div style="flex: 1;">
                    <label for="editQtdEmbalagem">Qtd na Embalagem</label>
                    <input id="editQtdEmbalagem" type="number" placeholder="Ex: 20">
                </div>
                <div style="flex: 1;">
                    <label for="editTipoUnidade">Tipo</label>
                    <select id="editTipoUnidade">
                        <option value="Comprimido(s)">Comprimido(s)</option>
                        <option value="Cápsula(s)">Cápsula(s)</option>
                        <option value="Frasco(s)">Frasco(s)</option>
                        <option value="Gota(s)">Gota(s)</option>
                        <option value="Pomada">Pomada</option>
                    </select>
                </div>
            </div>

            <label for="editSaldo">Quantidade em Estoque (Total)</label>
            <input id="editSaldo" type="number" placeholder="0">

            <label for="editValidade">Data de Validade</label>
            <input id="editValidade" type="date">

            <div class="modal-footer">
                <button id="btn-salvar">Salvar</button>
                <button id="btn-limpar" style="background-color: var(--color-text-base); opacity: 0.7;">Limpar</button>
                <button class="btn-cancelar" id="btn-fechar-modal">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="modal-aviso-container" class="modal-overlay">
        <div id="caixa-aviso" class="modal-content">
            <div id="aviso-icone"></div>
            <h3 id="aviso-titulo">Atenção</h3>
            <p id="aviso-texto"></p>
            <div class="modal-footer">
                <button id="btn-aviso-ok">OK</button>
                <button id="btn-aviso-cancelar" class="btn-cancelar">Cancelar</button>
            </div>
        </div>
    </div>
</body>

</html>
